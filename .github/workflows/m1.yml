name: Civis milestone checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12.11'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: python scripts/dev_env.py
      - run: docker compose up -d --wait postgres auth-db auth redis storage mail
      - run: docker compose exec -T postgres createdb -U civis civis_test
      - run: python scripts/run.py .venv/bin/python scripts/bootstrap_storage.py
        env:
          PYTHONPATH: apps/api
      - run: sh scripts/check_m1.sh
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm run lint && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: |
          python scripts/run.py .venv/bin/alembic -c apps/api/alembic.ini upgrade head
          python scripts/run.py .venv/bin/python scripts/seed.py
          python scripts/run.py .venv/bin/uvicorn civis.main:create_app --factory --host 127.0.0.1 --port 58000 --no-access-log > /tmp/civis-api.log 2>&1 &
      - run: npm start > /tmp/civis-web.log 2>&1 &
        working-directory: apps/web
      - run: python scripts/wait_http.py http://localhost:58000/v1/ready http://localhost:53000
      - run: npm test
        working-directory: apps/web
      - if: always()
        run: docker compose down
