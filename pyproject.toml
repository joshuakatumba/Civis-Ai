[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "evals"]
pythonpath = ["apps/api", "apps/worker"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "apps/api"
exclude = [".venv"]
